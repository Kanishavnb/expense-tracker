<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f4ff;
    color: #222;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  h1 { color: #1a2b5f; text-align: center; margin: 10px 0 16px; }
  h2 { color: #1a2b5f; font-size: 18px; margin: 0 0 10px; }
  .card {
    background: white;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .total { font-size: 32px; font-weight: bold; color: #1a2b5f; }
  label { display: block; font-weight: bold; margin-top: 10px; color: #1a2b5f; }
  input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 16px;
    margin-top: 4px;
    border: 1px solid #aab4d4;
    border-radius: 8px;
  }
  button {
    background: #1a2b5f;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 16px;
    cursor: pointer;
  }
  .add-btn { width: 100%; margin-top: 14px; }
  .error { color: #b00020; min-height: 20px; margin-top: 8px; font-size: 14px; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e3e8f5;
    padding: 8px 0;
    gap: 8px;
  }
  .row:last-child { border-bottom: none; }
  .row .title { font-weight: bold; }
  .row .meta { color: #666; font-size: 13px; }
  .row .amount { font-weight: bold; white-space: nowrap; }
  .del { background: #d32f2f; padding: 6px 10px; font-size: 13px; }
  .bar-row { margin: 8px 0; font-size: 14px; }
  .bar-top { display: flex; justify-content: space-between; }
  .bar-bg { background: #e3e8f5; border-radius: 6px; height: 10px; margin-top: 4px; }
  .bar-fill { background: #3b5bdb; height: 10px; border-radius: 6px; }
  .empty { color: #666; text-align: center; padding: 10px 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const CATEGORIES = ["Food", "Travel", "Shopping", "Bills", "Other"];

  function loadExpenses() {
    try {
      const saved = localStorage.getItem("expenses");
      return saved ? JSON.parse(saved) : [];
    } catch (error) {
      return [];
    }
  }

  function formatMoney(number) {
    return "\u20B9" + number.toFixed(2);
  }

  function ExpenseForm(props) {
    const [title, setTitle] = React.useState("");
    const [amount, setAmount] = React.useState("");
    const [category, setCategory] = React.useState("Food");
    const [error, setError] = React.useState("");

    function handleSubmit(event) {
      event.preventDefault();
      const cleanTitle = title.trim();
      const number = Number(amount);

      if (cleanTitle === "") {
        setError("Please enter a title.");
        return;
      }
      if (!(number > 0)) {
        setError("Amount must be more than 0.");
        return;
      }

      props.onAdd({
        id: Date.now(),
        title: cleanTitle,
        amount: number,
        category: category,
        date: new Date().toLocaleDateString("en-GB")
      });
      setTitle("");
      setAmount("");
      setError("");
    }

    return (
      <form className="card" onSubmit={handleSubmit}>
        <h2>Add an expense</h2>
        <label>Title</label>
        <input
          value={title}
          placeholder="e.g. Lunch"
          onChange={(e) => setTitle(e.target.value)}
        />
        <label>Amount</label>
        <input
          type="number"
          value={amount}
          placeholder="e.g. 120"
          onChange={(e) => setAmount(e.target.value)}
        />
        <label>Category</label>
        <select value={category} onChange={(e) => setCategory(e.target.value)}>
          {CATEGORIES.map((c) => (
            <option key={c} value={c}>{c}</option>
          ))}
        </select>
        <div className="error">{error}</div>
        <button className="add-btn" type="submit">Add expense</button>
      </form>
    );
  }

  function ExpenseItem(props) {
    const e = props.expense;
    return (
      <div className="row">
        <div>
          <div className="title">{e.title}</div>
          <div className="meta">{e.category} | {e.date}</div>
        </div>
        <div className="amount">{formatMoney(e.amount)}</div>
        <button className="del" onClick={props.onDelete}>Delete</button>
      </div>
    );
  }

  function Summary(props) {
    const total = props.expenses.reduce((sum, e) => sum + e.amount, 0);
    const byCategory = {};
    props.expenses.forEach((e) => {
      byCategory[e.category] = (byCategory[e.category] || 0) + e.amount;
    });

    return (
      <div className="card">
        <h2>Total spent</h2>
        <div className="total">{formatMoney(total)}</div>
        {total > 0 && <h2 style={{ marginTop: 14 }}>By category</h2>}
        {CATEGORIES.filter((c) => byCategory[c]).map((c) => {
          const percent = Math.round((byCategory[c] / total) * 100);
          return (
            <div className="bar-row" key={c}>
              <div className="bar-top">
                <span>{c}</span>
                <span>{formatMoney(byCategory[c])} ({percent}%)</span>
              </div>
              <div className="bar-bg">
                <div className="bar-fill" style={{ width: percent + "%" }}></div>
              </div>
            </div>
          );
        })}
      </div>
    );
  }

  function App() {
    const [expenses, setExpenses] = React.useState(loadExpenses);
    const [filter, setFilter] = React.useState("All");

    React.useEffect(() => {
      localStorage.setItem("expenses", JSON.stringify(expenses));
    }, [expenses]);

    function addExpense(expense) {
      setExpenses([expense, ...expenses]);
    }

    function deleteExpense(id) {
      setExpenses(expenses.filter((e) => e.id !== id));
    }

    const shown = filter === "All"
      ? expenses
      : expenses.filter((e) => e.category === filter);

    return (
      <div className="app">
        <h1>Expense Tracker</h1>
        <Summary expenses={expenses} />
        <ExpenseForm onAdd={addExpense} />
        <div className="card">
          <h2>Expenses</h2>
          <select value={filter} onChange={(e) => setFilter(e.target.value)}>
            <option value="All">All categories</option>
            {CATEGORIES.map((c) => (
              <option key={c} value={c}>{c}</option>
            ))}
          </select>
          {shown.length === 0 && <div className="empty">No expenses yet.</div>}
          {shown.map((e) => (
            <ExpenseItem
              key={e.id}
              expense={e}
              onDelete={() => deleteExpense(e.id)}
            />
          ))}
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
